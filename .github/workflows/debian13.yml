name: Debian 13 fresh-install gate

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    name: Debian 13 / system Perl 5.40 / fresh config
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:13-slim

    steps:
      - name: Install Debian 13 bootstrap and CI build tools
        shell: bash
        run: |
          set -euo pipefail

          # A CI container has no service manager. Prevent package postinst
          # scripts from trying to start MariaDB while still installing the
          # same server/client/bootstrap packages documented for operators.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash \
            systemd \
            ca-certificates \
            git \
            sudo \
            curl \
            wget \
            jq \
            unzip \
            zip \
            tar \
            perl \
            build-essential \
            make \
            gcc \
            pkg-config \
            mariadb-server \
            mariadb-client \
            libmariadb-dev \
            cpanminus

          rm -rf /var/lib/apt/lists/*

      - name: Check out the repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          # MB686: the upgrade gate exports the real stable 3.3 schema/tag.
          fetch-depth: 0

      - name: Trust the Debian 13 container checkout for Git metadata reads
        shell: bash
        run: |
          set -euo pipefail

          # The GitHub workspace is bind-mounted into this Debian container.
          # Its numeric owner may differ from root inside the container, so
          # Git 2.35+ can reject it as dubious ownership. Trust only this exact
          # runner-provided workspace path; never use safe.directory '*'.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          test "$(
            git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          )" = "$GITHUB_WORKSPACE"

      - name: Verify the Debian 13 system baseline
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release

          test "$ID" = debian
          test "$VERSION_ID" = 13

          perl -e 'die "expected Debian 13 system Perl 5.40.x\n" unless $] >= 5.040 && $] < 5.041; print "Perl $^V\n"'

          for cmd in perl cpan make gcc mysql mysqladmin mariadbd sudo mktemp find curl mariadb_config; do
            command -v "$cmd" >/dev/null
          done

          mysql --version
          mariadb_config --version

      - name: Build and verify runtime Perl dependencies on Debian 13
        shell: bash
        run: |
          set -euo pipefail
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"

          cpanm --notest --local-lib "$GITHUB_WORKSPACE/local" --installdeps .

          if perl -MHailo -e 'exit 0' >/dev/null 2>&1; then
            echo 'Hailo is already available.'
          elif cpanm --notest --local-lib "$GITHUB_WORKSPACE/local" Hailo; then
            echo 'Hailo installed from CPAN.'
          else
            echo 'Normal Hailo installation failed; using the supported 0.75 fallback.'
            cpanm --notest --local-lib "$GITHUB_WORKSPACE/local" \
              https://cpan.metacpan.org/authors/id/A/AV/AVAR/Hailo-0.75.tar.gz
          fi

          bash install/cpan_install.sh --verify-only

      - name: Exercise fresh non-root configuration generation
        shell: bash
        run: |
          set -euo pipefail
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"

          adduser --disabled-password --gecos '' mediabot

          install -d -m 0755 -o mediabot -g mediabot /home/mediabot/mediabot_v3
          tar \
            --exclude='./.git' \
            --exclude='./local' \
            --exclude='./mediabot.conf' \
            --exclude='./configure.log' \
            -cf - . \
            | tar -xf - -C /home/mediabot/mediabot_v3
          chown -R mediabot:mediabot /home/mediabot/mediabot_v3

          sudo -u mediabot env \
            HOME=/home/mediabot \
            PERL5LIB="$PERL5LIB" \
            bash -lc '
              set -euo pipefail
              cd /home/mediabot/mediabot_v3
              ./configure \
                --config /home/mediabot/mediabot_v3/mediabot.conf \
                --sync-only \
                --skip-db \
                --skip-cpan \
                --yes

              test "$(stat -c %a mediabot.conf)" = 600
              grep -Eq "^[[:space:]]*PARTYLINE_EVAL_ENABLED[[:space:]]*=[[:space:]]*0[[:space:]]*$" mediabot.conf
              perl install/configure_config.pl \
                --sample mediabot.sample.conf \
                --config mediabot.conf \
                --mode audit \
                --strict \
                --quiet
              grep -Fq "Fresh installation detected:" configure.log
              grep -Fq "Configuration synchronization completed (--sync-only)" configure.log
            '

      - name: Exercise systemd installation and static unit validation
        shell: bash
        run: |
          set -euo pipefail

          SYSTEMD_ROOT="$(mktemp -d /tmp/mediabot-systemd-root.XXXXXX)"
          cleanup_systemd_root() {
            rm -rf "$SYSTEMD_ROOT"
          }
          trap cleanup_systemd_root EXIT

          install -d -m 0755 "$SYSTEMD_ROOT/home/mediabot/mediabot_v3"
          install -m 0644 \
            /home/mediabot/mediabot_v3/mediabot.pl \
            "$SYSTEMD_ROOT/home/mediabot/mediabot_v3/mediabot.pl"
          install -m 0600 \
            /home/mediabot/mediabot_v3/mediabot.conf \
            "$SYSTEMD_ROOT/home/mediabot/mediabot_v3/mediabot.conf"

          bash install/systemd_install.sh \
            --root "$SYSTEMD_ROOT" \
            --instance ci \
            --bot-dir /home/mediabot/mediabot_v3

          cmp tools/systemd/mediabot@.service.example "$SYSTEMD_ROOT/etc/systemd/system/mediabot@.service"
          test "$(stat -c %a "$SYSTEMD_ROOT/etc/systemd/system/mediabot@.service")" = 644
          test "$(stat -c %a "$SYSTEMD_ROOT/etc/default/mediabot-ci")" = 644
          grep -Fxq 'BOT_DIR=/home/mediabot/mediabot_v3' "$SYSTEMD_ROOT/etc/default/mediabot-ci"
          grep -Fxq 'BOT_BIN=/home/mediabot/mediabot_v3/mediabot.pl' "$SYSTEMD_ROOT/etc/default/mediabot-ci"
          grep -Fxq 'BOT_CONF=/home/mediabot/mediabot_v3/mediabot.conf' "$SYSTEMD_ROOT/etc/default/mediabot-ci"

          # A second identical install must be a no-op success.
          bash install/systemd_install.sh \
            --root "$SYSTEMD_ROOT" \
            --instance ci \
            --bot-dir /home/mediabot/mediabot_v3

          # A divergent template must fail closed unless replacement is explicit.
          printf '\n# deliberate MB687 CI drift\n' >>"$SYSTEMD_ROOT/etc/systemd/system/mediabot@.service"
          if bash install/systemd_install.sh \
              --root "$SYSTEMD_ROOT" \
              --instance ci \
              --bot-dir /home/mediabot/mediabot_v3; then
            echo 'ERROR: divergent systemd template was overwritten without --replace-template' >&2
            exit 1
          fi

          bash install/systemd_install.sh \
            --root "$SYSTEMD_ROOT" \
            --instance ci \
            --bot-dir /home/mediabot/mediabot_v3 \
            --replace-template

          cmp tools/systemd/mediabot@.service.example "$SYSTEMD_ROOT/etc/systemd/system/mediabot@.service"
          systemd-analyze verify "$SYSTEMD_ROOT/etc/systemd/system/mediabot@.service"

          # Static/container validation deliberately never enables or starts a unit.
          test ! -e "$SYSTEMD_ROOT/etc/systemd/system/multi-user.target.wants/mediabot@ci.service"

      - name: Exercise fresh MariaDB database installation and strict drift validation
        shell: bash
        run: |
          set -euo pipefail
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"

          install -d -m 0755 -o mysql -g mysql /run/mysqld
          DB_LOG=/tmp/mediabot-mariadb.log

          mariadbd \
            --user=mysql \
            --datadir=/var/lib/mysql \
            --socket=/run/mysqld/mysqld.sock \
            --pid-file=/run/mysqld/mysqld.pid \
            --bind-address=127.0.0.1 \
            --log-error="$DB_LOG" &
          DB_PID=$!

          cleanup_db() {
            if kill -0 "$DB_PID" >/dev/null 2>&1; then
              kill "$DB_PID" >/dev/null 2>&1 || true
              wait "$DB_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_db EXIT

          ready=0
          for _ in $(seq 1 60); do
            if mysqladmin \
              --protocol=socket \
              --socket=/run/mysqld/mysqld.sock \
              -uroot ping --silent; then
              ready=1
              break
            fi
            if ! kill -0 "$DB_PID" >/dev/null 2>&1; then
              cat "$DB_LOG" >&2
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$DB_LOG" >&2
            exit 1
          fi

          mysql --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot \
            --skip-column-names --execute='SELECT VERSION();'

          (
            cd /tmp
            printf '\n\n\n\n\n\n' \
              | bash /home/mediabot/mediabot_v3/install/db_install.sh \
                  -c /home/mediabot/mediabot_v3/mediabot.conf
          )

          test "$(stat -c %U:%G /home/mediabot/mediabot_v3/mediabot.conf)" = mediabot:mediabot
          test "$(stat -c %a /home/mediabot/mediabot_v3/mediabot.conf)" = 600

          sudo -u mediabot env \
            HOME=/home/mediabot \
            PERL5LIB="$PERL5LIB" \
            bash -lc '
              set -euo pipefail
              cd /home/mediabot/mediabot_v3

              test "$(perl install/configure_config.pl --config mediabot.conf --get mysql.MAIN_PROG_DDBNAME)" = mediabot
              test "$(perl install/configure_config.pl --config mediabot.conf --get mysql.MAIN_PROG_DBUSER)" = mediabot
              test -n "$(perl install/configure_config.pl --config mediabot.conf --get mysql.MAIN_PROG_DBPASS)"

              perl tools/check_schema_drift.pl \
                --conf=mediabot.conf \
                --strict \
                --types \
                --indexes
            '

      - name: Exercise stable 3.3 to current database upgrade
        shell: bash
        run: |
          set -euo pipefail
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"

          STABLE_REF=3.3
          UPGRADE_DB=mediabot_upgrade
          STABLE_ROOT="$(mktemp -d /tmp/mediabot-stable-3.3.XXXXXX)"
          ROOT_CNF="$(mktemp /tmp/mediabot-upgrade-root.XXXXXX.cnf)"
          STABLE_FILES="$(mktemp /tmp/mediabot-stable-migrations.XXXXXX)"
          CURRENT_FILES="$(mktemp /tmp/mediabot-current-migrations.XXXXXX)"
          NEW_FILES="$(mktemp /tmp/mediabot-new-migrations.XXXXXX)"
          ORDERED_NEW="$(mktemp /tmp/mediabot-new-migrations-ordered.XXXXXX)"

          DB_PID=""
          DB_LOG=/tmp/mediabot-upgrade-mariadb.log
          cleanup_upgrade() {
            if [ -n "${DB_PID:-}" ] && kill -0 "$DB_PID" >/dev/null 2>&1; then
              kill "$DB_PID" >/dev/null 2>&1 || true
              wait "$DB_PID" >/dev/null 2>&1 || true
            fi
            rm -rf "$STABLE_ROOT" "$ROOT_CNF" "$STABLE_FILES" \
              "$CURRENT_FILES" "$NEW_FILES" "$ORDERED_NEW"
          }
          trap cleanup_upgrade EXIT

          install -d -m 0755 -o mysql -g mysql /run/mysqld
          mariadbd \
            --user=mysql \
            --datadir=/var/lib/mysql \
            --socket=/run/mysqld/mysqld.sock \
            --pid-file=/run/mysqld/mysqld.pid \
            --bind-address=127.0.0.1 \
            --log-error="$DB_LOG" &
          DB_PID=$!

          ready=0
          for _ in $(seq 1 60); do
            if mysqladmin \
              --protocol=socket \
              --socket=/run/mysqld/mysqld.sock \
              -uroot ping --silent; then
              ready=1
              break
            fi
            if ! kill -0 "$DB_PID" >/dev/null 2>&1; then
              cat "$DB_LOG" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$DB_LOG" >&2
            exit 1
          fi

          test "$(git show "${STABLE_REF}:VERSION" | tr -d '\r\n')" = 3.3
          git archive --format=tar "$STABLE_REF" -- install/mediabot.sql install/migrations \
            | tar -xf - -C "$STABLE_ROOT"

          find "$STABLE_ROOT/install/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | LC_ALL=C sort >"$STABLE_FILES"
          find install/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | LC_ALL=C sort >"$CURRENT_FILES"

          if comm -23 "$STABLE_FILES" "$CURRENT_FILES" | grep -q .; then
            echo 'ERROR: a migration present in stable 3.3 disappeared from the current tree' >&2
            comm -23 "$STABLE_FILES" "$CURRENT_FILES" >&2
            exit 1
          fi

          while IFS= read -r migration; do
            stable_sha="$(sha256sum "$STABLE_ROOT/install/migrations/$migration" | awk '{print $1}')"
            current_sha="$(sha256sum "install/migrations/$migration" | awk '{print $1}')"
            if [ "$stable_sha" != "$current_sha" ]; then
              echo "ERROR: released migration was modified after stable 3.3: $migration" >&2
              exit 1
            fi
          done <"$STABLE_FILES"

          comm -13 "$STABLE_FILES" "$CURRENT_FILES" >"$NEW_FILES"
          test -s "$NEW_FILES"

          # install/migrations/README.md is the public authoritative order.
          while IFS= read -r migration; do
            line="$(grep -nFx "$migration" install/migrations/README.md | cut -d: -f1)"
            test -n "$line"
            printf '%012d\t%s\n' "$line" "$migration"
          done <"$NEW_FILES" \
            | LC_ALL=C sort -n -k1,1 \
            | cut -f2- >"$ORDERED_NEW"

          test "$(wc -l <"$ORDERED_NEW" | tr -d ' ')" = "$(wc -l <"$NEW_FILES" | tr -d ' ')"

          mysql --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot --execute="
            DROP DATABASE IF EXISTS ${UPGRADE_DB};
            CREATE DATABASE ${UPGRADE_DB} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          "
          mysql --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot \
            --default-character-set=utf8mb4 "$UPGRADE_DB" \
            <"$STABLE_ROOT/install/mediabot.sql"

          set +e
          MEDIABOT_DB="$UPGRADE_DB" \
          MEDIABOT_DB_USER=root \
          MEDIABOT_DB_PASS='' \
          MEDIABOT_DB_SOCKET=/run/mysqld/mysqld.sock \
            perl tools/check_schema_drift.pl --strict --types --indexes --quiet
          PRE_MIGRATION_RC=$?
          set -e
          test "$PRE_MIGRATION_RC" -eq 1

          cat >"$ROOT_CNF" <<'EOF_ROOT_CNF'
          [client]
          user=root
          socket=/run/mysqld/mysqld.sock
          default-character-set=utf8mb4
          EOF_ROOT_CNF
          chmod 0600 "$ROOT_CNF"

          while IFS= read -r migration; do
            echo "Applying post-3.3 migration: $migration"
            bash install/db_migrate.sh \
              --defaults-extra-file "$ROOT_CNF" \
              "$UPGRADE_DB" \
              "install/migrations/$migration"
          done <"$ORDERED_NEW"

          MEDIABOT_DB="$UPGRADE_DB" \
          MEDIABOT_DB_USER=root \
          MEDIABOT_DB_PASS='' \
          MEDIABOT_DB_SOCKET=/run/mysqld/mysqld.sock \
            perl tools/check_schema_drift.pl --strict --types --indexes

      - name: Run Debian 13 fresh-install contracts
        shell: bash
        run: |
          set -euo pipefail
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5:$GITHUB_WORKSPACE${PERL5LIB:+:$PERL5LIB}"

          perl t/test_commands.pl \
            -f '^(119_|125_|132_|597_|598_|599_|600_|610_|717_|718_|719_|720_|723_|830_|884_|885_|886_|887_|888_|889_)'
